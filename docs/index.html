<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Агрегатор</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #00e676; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; background: #1e1e1e; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .card { background: #1e1e1e; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid #00e676; }
        .card.dead { border-left-color: #f44336; opacity: 0.6; }
        .header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
        .details { font-size: 14px; color: #aaa; }
        .tag { display: inline-block; background: #333; padding: 2px 6px; border-radius: 4px; margin-right: 5px; font-size: 12px; }
        .copy-btn { background: #00e676; color: #000; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        #stats { text-align: center; margin-bottom: 20px; color: #888; }
    </style>
</head>
<body>
<div class="container">
    <h1>🌐 VPN Агрегатор</h1>
    <div id="stats">Загрузка...</div>
    <input type="text" id="search" placeholder="Поиск по стране, протоколу, SNI...">
    <div id="list"></div>
</div>

<script>
    let servers = [];
    fetch('servers.json')
        .then(r => r.json())
        .then(data => {
            servers = data.servers;
            document.getElementById('stats').innerText = `Обновлено: ${new Date(data.updated).toLocaleString()} | Всего: ${data.count}`;
            render(servers);
        });

    document.getElementById('search').addEventListener('input', e => {
        const q = e.target.value.toLowerCase();
        render(servers.filter(s => 
            s.name.toLowerCase().includes(q) || 
            s.proto.toLowerCase().includes(q) || 
            s.sni.toLowerCase().includes(q) ||
            s.source.toLowerCase().includes(q)
        ));
    });

    function render(list) {
        const el = document.getElementById('list');
        el.innerHTML = list.map(s => `
            <div class="card ${s.alive ? '' : 'dead'}">
                <div class="header">
                    <span>${s.name || 'Unnamed'} <span class="tag">${s.proto.toUpperCase()}</span></span>
                    <span>${s.alive ? '🟢 ' + s.ms + 'ms' : '🔴 Dead'}</span>
                </div>
                <div class="details">
                     ${s.host}:${s.port} | 🎭 SNI: ${s.sni || 'нет'} |  ${s.source}
                </div>
                <button class="copy-btn" onclick="copyLink('${btoa(s.link)}')"> Скопировать ссылку</button>
            </div>
        `).join('');
    }

    function copyLink(b64) {
        navigator.clipboard.writeText(atob(b64));
        alert('Скопировано!');
    }
</script>
</body>
</html>
